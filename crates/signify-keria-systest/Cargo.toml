[package]
name = "signify-keria-systest"
version.workspace = true
description = "Opt-in system tests that record a live KERIA deployment's answers as fixtures"
edition.workspace = true
rust-version.workspace = true
publish = false
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
keri-acdc.workspace = true
keri-cesr.workspace = true
keri-protocol.workspace = true
signify-client.workspace = true
signify-keys.workspace = true
keria-types.workspace = true
signify-http.workspace = true

[features]
# The production transport, and with it a TLS stack. Off by default so the workspace's ordinary
# build graph does not carry hyper and rustls for a crate most builds never run.
live = ["signify-http/http-client"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
