[package]
name = "signify-crypto"
version = "0.0.0"
description = "Cryptographic operations for Signify"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
signify-cesr = { path = "../signify-cesr" }
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "digest"
harness = false

[[bench]]
name = "verifier"
harness = false

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "signer"
harness = false

[lints]
workspace = true
