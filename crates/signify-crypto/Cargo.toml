[package]
name = "signify-crypto"
version = "0.0.0"
description = "Cryptographic operations for Signify"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
argon2id-p1.workspace = true
blake3 = { version = "1.8.6", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom.workspace = true
nacl-sealed-box = { version = "0.2.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.10.1", default-features = false }
signify-cesr = { path = "../signify-cesr" }
subtle = { version = "2.6.1", default-features = false }
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "digest"
harness = false

[[bench]]
name = "verifier"
harness = false

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "signer"
harness = false

[[bench]]
name = "salt"
harness = false

[[bench]]
name = "cipher"
harness = false

[lints]
workspace = true
