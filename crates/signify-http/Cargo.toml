[package]
name = "signify-http"
version.workspace = true
description = "HTTP transport, requests, responses and retries for Signify, signed with keri-http-auth"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/signify-http"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
http-client = [
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
    "dep:tokio",
]

[dependencies]
keri-cesr.workspace = true
keri-http-auth.workspace = true

getrandom.workspace = true

http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "request_response"
harness = false

[[bench]]
name = "retry"
harness = false

[[bench]]
name = "auth"
harness = false

[[bench]]
name = "http_client"
harness = false
required-features = ["http-client"]

[lints]
workspace = true
