[package]
name = "signify-client"
version = "0.0.0"
description = "High-level asynchronous Signify SDK client"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
signify-acdc = { path = "../signify-acdc" }
signify-cesr = { path = "../signify-cesr" }
signify-crypto = { path = "../signify-crypto" }
signify-http = { path = "../signify-http" }
signify-keri = { path = "../signify-keri" }
signify-types = { path = "../signify-types" }

getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "identifiers"
harness = false

[[bench]]
name = "key_state"
harness = false

[[bench]]
name = "registries"
harness = false

[[bench]]
name = "schemas"
harness = false

[[bench]]
name = "credentials"
harness = false

[lints]
workspace = true
