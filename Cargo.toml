[workspace]
resolver = "3"
members = [
    "crates/signify-client",
    "crates/signify-http",
    "crates/signify-keys",
    "crates/signify-keria-systest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AABelkhiria/signify-client"
keywords = ["keri", "acdc", "cesr", "identity", "cryptography"]
categories = ["authentication", "cryptography", "web-programming::http-client"]

[workspace.dependencies]
# The workspace's own crates. Their `version` must move together with `workspace.package.version`;
# cargo refuses to publish when the two drift apart.
signify-client = { path = "crates/signify-client", version = "0.1.0" }
signify-http = { path = "crates/signify-http", version = "0.1.0" }
signify-keys = { path = "crates/signify-keys", version = "0.1.0" }

criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }
http = { version = "1.4.0", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.8.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "native-tokio", "ring"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
keri-cesr = { version = "0.1.0", features = ["crypto"] }
keri-acdc = "0.2.0"
keri-http-auth = "0.1.0"
keri-protocol = "0.2.0"
keria-types = "0.1.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
