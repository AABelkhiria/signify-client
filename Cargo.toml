[workspace]
resolver = "3"
members = [
    "crates/signify",
    "crates/signify-acdc",
    "crates/signify-cesr",
    "crates/signify-client",
    "crates/signify-crypto",
    "crates/signify-http",
    "crates/signify-keri",
    "crates/signify-types",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false
keywords = ["keri", "acdc", "cesr", "identity", "cryptography"]
categories = ["authentication", "cryptography", "web-programming::http-client"]

[workspace.dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
