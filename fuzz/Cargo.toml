[package]
name = "signify-cesr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
signify-cesr = { path = "../crates/signify-cesr" }

[[bin]]
name = "foundations"
path = "fuzz_targets/foundations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "code_tables"
path = "fuzz_targets/code_tables.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matter"
path = "fuzz_targets/matter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "indexer"
path = "fuzz_targets/indexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "counter"
path = "fuzz_targets/counter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "number"
path = "fuzz_targets/number.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sequence"
path = "fuzz_targets/sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bexter"
path = "fuzz_targets/bexter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path"
path = "fuzz_targets/path.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
