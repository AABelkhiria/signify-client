[package]
name = "signify-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }
keri-protocol = "0.1.0"
keria-types = "0.1.0"
libfuzzer-sys = "0.4.13"
signify-acdc = { path = "../crates/signify-acdc" }
signify-client = { path = "../crates/signify-client" }
signify-http = { path = "../crates/signify-http" }
signify-keri = { path = "../crates/signify-keri" }
serde_json = "1.0.151"

