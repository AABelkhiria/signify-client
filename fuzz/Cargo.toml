[package]
name = "signify-cesr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
signify-cesr = { path = "../crates/signify-cesr" }
signify-crypto = { path = "../crates/signify-crypto" }
signify-keri = { path = "../crates/signify-keri" }

